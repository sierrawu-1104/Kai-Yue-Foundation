    <section class="events-hero">
      <img src="images/Partnerships%20Page/partnerships-hero-image.jpeg" alt="" class="events-hero-image" />
      <div class="events-hero-content">
        <h1 class="events-hero-title">PARTNERSHIPS</h1>
        <p class="page-subtitle">
          We passionately support organizations where our <br>
          funding makes the greatest impact.
        </p>
      </div>
    </section>

    <section class="partnerships-list">

      <div class="partner-group">
        <h2 class="partnerships-heading">Venues</h2>
        <div class="partner-grid partner-grid-three partner-grid-venues">

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-carnegie-hall.webp" alt="Carnegie Hall" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Carnegie Hall<br><span class="partner-label-sub">New York, NY</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  Carnegie Hall is a concert venue in Midtown Manhattan in New York City, United States, located at 881 Seventh Avenue, occupying the east stretch of Seventh Avenue between West 56th Street and West 57th Street, two blocks south of Central Park. Carnegie Hall's mission is to present extraordinary music and musicians on the three stages of this legendary hall, to bring the transformative power of music to the widest possible audience, to provide visionary education programs, and to foster the future of music through the cultivation of new works, artists and audiences.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-kravis-center.png" alt="Kravis Center for the Performing Arts" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Kravis Center for the Performing Arts<br><span class="partner-label-sub">West Palm Beach, FL</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  The Raymond F. Kravis Center for the Performing Arts, located in the heart of downtown West Palm Beach, Florida, is one of South Florida's leading cultural landmarks and premier destinations for world-class entertainment. Across its distinguished venues, the Kravis Center presents an exceptional range of programming, including acclaimed Broadway productions, classical concerts, comedy performances, cultural events, and impactful arts education initiatives.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-mccarter-theater.webp" alt="McCarter Theatre" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">McCarter Theatre<br><span class="partner-label-sub">Princeton, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  McCarter Theater Center for the Performing Arts in Princeton is one of the most active cultural centers in the nation, offering over 200 performances of theater, dance, music and special events each year. McCarter's audience is truly a regional one. Over 200,000 people come to McCarter each season from all twenty-one counties in New Jersey as well as Pennsylvania, New York and twenty-three additional states.
                </p>
              </div>
            </div>
          </button>
          </div>

          

        </div>
      </div>

      <div class="partner-group">
        <h2 class="partnerships-heading">Organizations</h2>
        <div class="partner-grid partner-grid-three partner-grid-organizations">

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-tim-keyes-consort.png" alt="Tim Keyes Consort" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Tim Keyes Consort<br><span class="partner-label-sub">Plainfield, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  Tim Keyes Consort is a New Jersey Non-Profit 501(c)3 Corporation organized solely for charitable, educational, cultural and literary purposes. Tim Keyes continuously seeks out gifted and like-minded individuals to perform new and standard choral and orchestral repertoire. A pursuit of excellence drives every aspect of the Consort. From organization, to programming, to performance, Tim Keyes expects the best from his musicians and support staff.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-peking-university.png" alt="Peking University Alumni Association of Greater New York" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Peking University Alumni Association<br><span class="partner-label-sub">New York, NY</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  PKUAA is a 501c3 not-for-profit organization registered in the State of New York serving Peking University (PKU) alumni in the Greater New York area. Its mission is to protect and promote the welfare of alumni; to help advance the personal and professional development of alumni; to facilitate and foster their communication and connection with each other and with Alma Mater; to help support the advancement of Alma Mater; and to serve as a platform of information exchange, mutual understanding and collaboration between Alma Mater and other organizations, and between China and U.S.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-AAWMA.png" alt="American Alliance for World Music and Arts" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">American Alliance for World Music and Arts<br><span class="partner-label-sub">Princeton, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  American Alliance for World Music and Arts is a non-profit organization dedicated to broaden the rich melodies and diverse repertories of Chinese music through innovative programs and to encourage cross-art form collaborations. The Alliance facilitates the creation, performance, teaching, and administration of culturally diverse world music and encourages communication within and outside of the world music field. AAWMA is home to music virtuosos, artists, educators, as well as talented youths and groups that introduce Chinese music to the American community in every style and method imaginable.
                </p>
                <p class="partner-text">
                  AAWMA's educational program has a tradition of bringing masters in and promoting and presenting tomorrow's emerging talents. In 2010 and 2012, AAWMA successfully hosted two International Chinese Music Festivals in China National Orchestra (in Beijing) and Princeton University in 2012, which were also co-hosted by the China National Orchestra and Princeton University Chinese Music Ensemble. These programs are not only delightful for the community members, but also help to discover the next generation of talented classical musicians with the ability to blend Western and Chinese music.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-MCHF.png" alt="Montreal Chinese Hospital Foundation" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Montreal Chinese Hospital Foundation<br><span class="partner-label-sub">Montreal, Quebec</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  The Montreal Chinese Hospital Foundation was established in 1972 for the purpose of receiving and maintaining funds in order to make gifts, grants, contributions and donations to the Montreal Chinese Hospital and other relative medical services beneficial to and required by the Chinese Community in Montreal, Province of Quebec.
                </p>
                <p class="partner-text">
                  The collected funds are used at the Montreal Chinese Hospital to finance equipment and patient care services that are not covered under the budgets of the Quebec Department of Health and Social Services. Funds are also used to finance such other medical services, as the pre-natal care program, to the Montreal Chinese Community through the Montreal Chinese Hospital.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-MCCCA-.png" alt="Montreal Center of Chinese Culture and Arts" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Montreal Center of Chinese Culture and Arts<br><span class="partner-label-sub">Montreal, Quebec</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  Founded in Montreal on August 11, 1996, the Montreal Center of Chinese Culture and Arts (MCCCA) is the first and largest organization of its kind in Greater Montreal. It consists of folk dances, folk music instrumental ensemble, vocal group, waist drums, lion dances, art school and cultural services.
                </p>
                <p class="partner-text">
                  It is composed of a sizable body of enthusiastic members who, apart from their other achievements in life, are diversified and versatile in artistic talents and performing skills. MCCCA has staged over hundreds of impressive performances to the Chinese, Canadian and American communities in and around Montreal, many other cities of Eastern Canada and US, on important social, cultural and other festive occasions.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-bravura.png" alt="Bravura Philharmonic Orchestra" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Bravura Philharmonic Orchestra<br><span class="partner-label-sub">West Windsor, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  This young orchestra was founded by and is under the direction of the internationally-renowned conductor and Steinway Artist Chiu-Tze Lin. It consists of professional musicians, gifted amateurs, and outstanding young music students. The orchestra, together with its ensembles, are available to provide musical services to the community. The Bravura Philharmonic Orchestra has four programs a year in its concert season: a Season-Opening Concert, a Holiday Concert in December, a Family Concert in March, and a Spring Concert in May. The orchestra also sponsors an annual Young Artists Competition, with the winners performing in concert with the orchestra in May.
                </p>
              </div>
            </div>
          </button>
          </div>

        </div>
      </div>

      <div class="partner-group">
        <h2 class="partnerships-heading">Education</h2>
        <div class="partner-grid partner-grid-three partner-grid-staggered partner-grid-education">

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-peddie.png" alt="Peddie School" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Peddie School<br><span class="partner-label-sub">Hightstown, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  Guided by the confidence of our motto, "We Finish Our Labors to Begin Them Anew," Peddie School is committed to the intellectual, social, and moral growth of each of our students. We welcome individuals with diverse talents and backgrounds whose excitement, curiosity and character create an educational community where passion for learning grows. In this boarding school environment we not only prepare our students for the rigors and rewards of college, but also inspire each to strive for the highest quality of citizenship.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-princeton-day-school.png" alt="Princeton Day School" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Princeton Day School<br><span class="partner-label-sub">Princeton, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  Princeton Day School nurtures the mind, the body, and the character of each student. In academics, athletics, the arts, and service, we celebrate the pursuit of individual excellence and the spirit of collaboration that binds us together as a community. We seek diversity of cultures, views, and talents to promote the intellectual growth and moral development of students. Integrity, respect, and compassion are essential to the school's mission. Our students leave Princeton Day School well equipped for college and beyond: prepared to act knowledgeably, to lead thoughtfully, to share generously, and to contribute meaningfully.
                </p>
              </div>
            </div>
          </button>
          </div>

          <span class="partner-row-break" aria-hidden="true"></span>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-yinghua-chinese-school.png" alt="YingHua Language School" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">YingHua Language School<br><span class="partner-label-sub">Lawrenceville, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  YingHua Language School is a non-profit organization located in Lawrenceville, New Jersey. Its founding principle is to build a language school that can commit to and focus on students' Chinese language education so that its graduates would truly gain solid language skills. Currently it is the only school in New Jersey that has fully adopted Dr. Liping Ma's "Direct Character Recognition" methodology, teaching modern simplified Chinese characters and introducing the Chinese phonetic system (PinYin) as a tool at the appropriate stage.
                </p>
              </div>
            </div>
          </button>
          </div>

          <div class="partner-card-outer">
<button class="partner-card" type="button" aria-expanded="false">
            <div class="partner-card-head">
              <img src="images/Partnerships%20Page/partnerships-HX-chinese-school.png" alt="Huaxia Chinese School" class="partner-image" />
            <p class="partner-label">
              <span class="partner-label-text">Huaxia Chinese School<br><span class="partner-label-sub">Plainsboro, NJ</span></span>
              <span class="partner-label-icon" aria-hidden="true"></span>
            </p>
            </div>
            <div class="partner-body">
              <div class="partner-body-inner">
                <p class="partner-text">
                  Huaxia Chinese School is an independent, non-profit, non-religious, and non-political cultural education institution. Its purposes include teaching Chinese language and Chinese culture, and engaging in cultural-awareness activities in the community. The main Chinese language curriculum is offered from Kindergarten through ninth grade, alongside Advanced Chinese and Chinese as a Second Language (CSL) programs. Culture programs include Kungfu, Tai-chi, Fencing, Gymnastics, Badminton, Volleyball, Wei-qi (Go), Xiang-qi (Chinese Chess), Math, Traditional Chinese Musical Instruments, Drawing, and Crafts. The current enrollment of about 800 students is the largest in the Huaxia Chinese school system.
                </p>
              </div>
            </div>
          </button>
          </div>

        </div>
      </div>
